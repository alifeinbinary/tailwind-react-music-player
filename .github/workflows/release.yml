name: Release

on:
  push:
    branches: [master, next]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn playwright install --with-deps chromium
      - run: yarn test
      - run: yarn build
      - run: yarn smoke:import
      - run: yarn check:package
      - run: yarn smoke:pack
      - run: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
