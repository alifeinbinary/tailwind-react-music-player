name: Welcome Pull Request

on:
  issues:
    types: [labeled]

jobs:
  create-comment:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'Welcome PR'
    steps:
      - name: Create comment
        uses: actions-cool/issues-helper@v2.0.0
        with:
          actions: 'create-comment,close-issue'
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: |
            Hello @${{ github.event.issue.user.login }},

            Welcome to the [${{ github.repository }}] repository! We're thrilled to see your contribution. 🎉

            If you're new to this project, please make sure to read our [Contribution Guidelines](https://github.com/${{ github.repository }}/blob/main/CONTRIBUTING.md).

            If you'd like to implement some new functionality or bug fix yourself, you can fork the project and create a PR from your fork. We're here to help if you have any questions or need guidance.

            Looking forward to seeing your contributions! 🚀
